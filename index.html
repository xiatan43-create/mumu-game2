<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟沐沐：梦幻换装版</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f3f0f7;
            text-align: center;
            color: #4b4352;
            padding-bottom: 50px;
        }
        .game {
            max-width: 460px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(162, 134, 199, 0.15);
            position: relative;
        }
        h1 { margin-top: 0; font-size: 26px; color: #6c5b7b; }
        
        .top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .level-badge {
            background: #e2d5f3;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
        }
        .currency {
            font-weight: bold;
            background: #fff3cd;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
        }

        .stage {
            background: linear-gradient(180deg, #fbf7ff 0%, #ede3f7 100%);
            border-radius: 20px;
            padding: 20px 0;
            margin: 15px 0;
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid #e8def5;
        }
        .mumu-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .mumu-face {
            font-size: 55px;
            line-height: 1;
        }
        .mumu-clothes {
            font-size: 45px;
            line-height: 1;
        }
        .mumu-hat {
            font-size: 35px;
            line-height: 1;
        }
        .bounce { animation: characterBounce 0.3s ease; }
        @keyframes characterBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) translateY(-5px); }
        }

        .stats { text-align: left; margin: 15px 0; }
        .stat { margin: 10px 0; }
        .stat-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
        .bar { height: 10px; background: #eee; border-radius: 20px; overflow: hidden; }
        .fill { height: 100%; width: 0%; transition: width 0.4s ease; }
        
        #moodBar { background: #ffb7b2; }
        #foodBar { background: #ffdac1; }
        #energyBar { background: #e2f0cb; }
        #loveBar { background: #b5ead7; }

        .tabs {
            display: flex;
            background: #eee;
            border-radius: 12px;
            margin: 15px 0;
            padding: 2px;
        }
        .tab {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 10px;
            background: transparent;
        }
        .tab.active {
            background: white;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .panel { display: none; }
        .panel.active {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .item-card {
            background: #fbf9fc;
            border: 1px solid #ebdff5;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .item-card span { font-size: 12px; }
        .item-card .price { font-size: 11px; color: #b58900; font-weight: bold; }

        button {
            border: none;
            padding: 8px 10px;
            border-radius: 10px;
            background: #d9c8eb;
            color: #4b4352;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
        button.use-btn { background: #b5ead7; }
        button.equipped { background: #ffb7b2; color: white; }
        
        #message {
            min-height: 45px;
            margin-top: 15px;
            padding: 10px;
            background: #f8f6fa;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 4px solid #b9a1d8;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-group button {
            font-size: 12px;
            padding: 6px;
        }
        .reset-btn { background: #eaeaea; margin-top: 10px; font-size: 11px; padding: 5px; border-radius: 8px; width: auto; color: #888; }
    </style>
</head>
<body>
    <div class="game">
        <div class="top-info">
            <div class="level-badge" id="lvBadge">Lv.1 初识恋人</div>
            <div class="currency">🪙 <span id="coinText">20</span></div>
        </div>
        
        <h1>虚拟沐沐</h1>
        
        <div class="stage">
            <div class="mumu-display" id="mumuDisplay">
                <div class="mumu-hat" id="layerHat"></div>
                <div class="mumu-face" id="layerFace"></div>
                <div class="mumu-clothes" id="layerClothes"></div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label"><span>❤️ 心情</span><span id="moodText">100</span></div>
                <div class="bar"><div class="fill" id="moodBar"></div></div>
            </div>
            <div class="stat">
                <div class="stat-label"><span>🍔 饱腹</span><span id="foodText">80</span></div>
                <div class="bar"><div class="fill" id="foodBar"></div></div>
            </div>
            <div class="stat">
                <div class="stat-label"><span>⚡ 精力</span><span id="energyText">90</span></div>
                <div class="bar"><div class="fill" id="energyBar"></div></div>
            </div>
            <div class="stat">
                <div class="stat-label"><span>💞 亲密</span><span id="loveText">99</span></div>
                <div class="bar"><div class="fill" id="loveBar"></div></div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(this, 'tab-action')">日常互动</div>
            <div class="tab" onclick="switchTab(this, 'tab-shop')">小美食店</div>
            <div class="tab" onclick="switchTab(this, 'tab-wardrobe')">梦幻衣橱</div>
        </div>

        <div id="tab-action" class="panel active">
            <button onclick="pet()">💬 戳戳贴贴</button>
            <button onclick="sleep()" id="sleepBtn">💤 盖被睡觉</button>
            <button onclick="work()" id="workBtn">💼 努力打工</button>
        </div>

        <div id="tab-shop" class="panel">
            <div class="item-card"><span>🍰 草莓蛋糕</span><span class="price">🪙10</span><button onclick="buyFood('cake', 10)">购买</button></div>
            <div class="item-card"><span>🧋 珍珠奶茶</span><span class="price">🪙15</span><button onclick="buyFood('milktea', 15)">购买</button></div>
            <div class="item-card"><span>🎁 豪华轻奢礼</span><span class="price">🪙35</span><button onclick="buyFood('gift', 35)">购买</button></div>
        </div>

        <div id="tab-wardrobe" class="panel">
            <div class="item-card"><span>👗 经典常服</span><span class="price" id="p-c1">已拥有</span><button class="use-btn" id="b-c1" onclick="equip('clothes', 'c1')">穿上</button></div>
            <div class="item-card"><span>🎀 洛丽塔裙</span><span class="price" id="p-c2">🪙40</span><button class="use-btn" id="b-c2" onclick="equip('clothes', 'c2')">购买</button></div>
            <div class="item-card"><span>👑 优雅晚礼</span><span class="price" id="p-c3">🪙80</span><button class="use-btn" id="b-c3" onclick="equip('clothes', 'c3')">购买</button></div>
            <div class="item-card"><span>❌ 不戴头饰</span><span class="price">免费</span><button class="use-btn" id="b-h0" onclick="equip('hat', 'h0')">摘下</button></div>
            <div class="item-card"><span>🐱 猫咪耳朵</span><span class="price" id="p-h1">🪙30</span><button class="use-btn" id="b-h1" onclick="equip('hat', 'h1')">购买</button></div>
            <div class="item-card"><span>🎓 学士帽</span><span class="price" id="p-h2">🪙60</span><button class="use-btn" id="b-h2" onclick="equip('hat', 'h2')">购买</button></div>
        </div>
        
        <div id="message">加载中...</div>

        <!-- 新增的存档按钮组 -->
        <div class="btn-group">
            <button onclick="manualSave()" style="background:#c8ebd9;">💾 手动存档</button>
            <button onclick="manualLoad()" style="background:#ebd9c8;">📂 读取存档</button>
        </div>
        
        <button class="reset-btn" onclick="resetGame()">重置游戏</button>
    </div>

    <script>
        let defaultSave = {
            mood: 100, food: 80, energy: 90, love: 99, coins: 30, isSleeping: false,
            unlocked: ['c1', 'h0'],
            eqClothes: 'c1',
            eqHat: 'h0'
        };
        let mumu = JSON.parse(localStorage.getItem('mumu_dress_save')) || JSON.parse(JSON.stringify(defaultSave));

        const ASSETS = {
            expressions: { normal: "(*^_^*)", happy: "(≧▽≦)", sad: "(╥_╥)", sleep: "(˘ω˘)" },
            clothes: { c1: "👗", c2: "🎀", c3: "👑" },
            hats: { h0: "", h1: "🐱", h2: "🎓" }
        };

        const PRICES = {
            clothes: { c2: 40, c3: 80 },
            hat: { h1: 30, h2: 60 }
        };

        function getLevelTitle(love) {
            if (love >= 200) return "Lv.5 灵魂伴侣";
            if (love >= 150) return "Lv.4 甜蜜同居";
            if (love >= 100) return "Lv.3 热恋情侣";
            if (love >= 60) return "Lv.2 暧昧对象";
            return "Lv.1 初识恋人";
        }

        function updateUI() {
            document.getElementById('moodText').innerText = Math.round(mumu.mood);
            document.getElementById('moodBar').style.width = Math.max(0, Math.min(100, mumu.mood)) + '%';

            document.getElementById('foodText').innerText = Math.round(mumu.food);
            document.getElementById('foodBar').style.width = Math.max(0, Math.min(100, mumu.food)) + '%';

            document.getElementById('energyText').innerText = Math.round(mumu.energy);
            document.getElementById('energyBar').style.width = Math.max(0, Math.min(100, mumu.energy)) + '%';

            document.getElementById('loveText').innerText = Math.round(mumu.love);
            document.getElementById('loveBar').style.width = Math.max(0, Math.min(100, mumu.love)) + '%';

            document.getElementById('coinText').innerText = mumu.coins;
            document.getElementById('lvBadge').innerText = getLevelTitle(mumu.love);

            let face = ASSETS.expressions.normal;
            if (mumu.isSleeping) face = ASSETS.expressions.sleep;
            else if (mumu.mood < 30) face = ASSETS.expressions.sad;
            else if (mumu.love > 80) face = ASSETS.expressions.happy;
            document.getElementById('layerFace').innerText = face;

            document.getElementById('layerClothes').innerText = ASSETS.clothes[mumu.eqClothes] || "";
            document.getElementById('layerHat').innerText = ASSETS.hats[mumu.eqHat] || "";

            ['c1', 'c2', 'c3'].forEach(id => {
                const btn = document.getElementById('b-' + id);
                const price = document.getElementById('p-' + id);
                if (!btn) return;
                const owned = mumu.unlocked.includes(id);
                if (owned) {
                    price.innerText = '已拥有';
                    if (mumu.eqClothes === id) {
                        btn.innerText = '已穿上';
                        btn.classList.add('equipped');
                    } else {
                        btn.innerText = '穿上';
                        btn.classList.remove('equipped');
                    }
                } else {
                    price.innerText = '🪙' + PRICES.clothes[id];
                    btn.innerText = '购买';
                    btn.classList.remove('equipped');
                }
            });

            ['h0', 'h1', 'h2'].forEach(id => {
                const btn = document.getElementById('b-' + id);
                const price = document.getElementById('p-' + id);
                if (!btn) return;
                if (id === 'h0') {
                    price.innerText = '免费';
                    if (mumu.eqHat === 'h0') {
                        btn.innerText = '未戴';
                        btn.classList.add('equipped');
                    } else {
                        btn.innerText = '摘下';
                        btn.classList.remove('equipped');
                    }
                    return;
                }
                const owned = mumu.unlocked.includes(id);
                if (owned) {
                    price.innerText = '已拥有';
                    if (mumu.eqHat === id) {
                        btn.innerText = '已戴上';
                        btn.classList.add('equipped');
                    } else {
                        btn.innerText = '戴上';
                        btn.classList.remove('equipped');
                    }
                } else {
                    price.innerText = '🪙' + PRICES.hat[id];
                    btn.innerText = '购买';
                    btn.classList.remove('equipped');
                }
            });

            const sleepBtn = document.getElementById('sleepBtn');
            if (sleepBtn) sleepBtn.innerText = mumu.isSleeping ? '☀️ 叫醒她' : '💤 盖被睡觉';
        }

        function save() {
            localStorage.setItem('mumu_dress_save', JSON.stringify(mumu));
        }

        function showMessage(text) {
            document.getElementById('message').innerText = text;
        }

        // ===== 新增的手动存档 / 读档功能 =====
        function manualSave() {
            save();
            showMessage("✅ 进度已手动保存！可以放心关闭了。");
        }

        function manualLoad() {
            const data = localStorage.getItem('mumu_dress_save');
            if (data) {
                mumu = JSON.parse(data);
                updateUI();
                showMessage("📂 已成功读取上次的存档。");
            } else {
                showMessage("⚠️ 没有找到存档，先玩一会儿再存吧。");
            }
        }
        // ===================================

        function bounce() {
            const el = document.getElementById('mumuDisplay');
            el.classList.remove('bounce');
            void el.offsetWidth;
            el.classList.add('bounce');
        }

        function switchTab(el, tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function pet() {
            if (mumu.isSleeping) { showMessage("沐沐在睡觉呢，别吵醒她~"); return; }
            if (mumu.energy < 5) { showMessage("沐沐太累了，先让她休息一下吧。"); return; }
            mumu.mood = Math.min(100, mumu.mood + 5);
            mumu.love = Math.min(999, mumu.love + 2);
            mumu.energy = Math.max(0, mumu.energy - 2);
            showMessage("沐沐开心地蹭了蹭你的手~ ❤️");
            bounce();
            updateUI(); save();
        }

        function sleep() {
            if (mumu.isSleeping) {
                mumu.isSleeping = false;
                showMessage("沐沐醒来了，精神满满！");
                updateUI(); save();
                return;
            }
            if (mumu.energy >= 100) { showMessage("沐沐现在精力充沛，还不困哦~"); return; }
            mumu.isSleeping = true;
            let gain = Math.min(60, 100 - mumu.energy);
            mumu.energy = Math.min(100, mumu.energy + 60);
            mumu.food = Math.max(0, mumu.food - 10);
            showMessage("沐沐睡着了，恢复了 " + Math.round(gain) + " 点精力。");
            updateUI(); save();
        }

        function work() {
            if (mumu.isSleeping) { showMessage("沐沐在睡觉，不能打工哦~"); return; }
            if (mumu.energy < 20) { showMessage("精力不足，先休息一下吧。"); return; }
            if (mumu.food < 20) { showMessage("肚子饿了，先吃点东西吧。"); return; }
            const earn = 10 + Math.floor(Math.random() * 11);
            mumu.coins += earn;
            mumu.energy = Math.max(0, mumu.energy - 20);
            mumu.food = Math.max(0, mumu.food - 15);
            mumu.mood = Math.max(0, mumu.mood - 5);
            showMessage("努力打工赚到了 🪙" + earn + " 金币！");
            bounce();
            updateUI(); save();
        }

        function buyFood(type, price) {
            if (mumu.coins < price) { showMessage("金币不够啦，去打工赚钱吧~"); return; }
            mumu.coins -= price;
            let msg = "";
            if (type === 'cake') { mumu.food = Math.min(100, mumu.food + 20); mumu.mood = Math.min(100, mumu.mood + 5); msg = "沐沐吃掉了草莓蛋糕，饱腹+20 心情+5"; }
            if (type === 'milktea') { mumu.food = Math.min(100, mumu.food + 15); mumu.mood = Math.min(100, mumu.mood + 10); msg = "沐沐喝掉了珍珠奶茶，饱腹+15 心情+10"; }
            if (type === 'gift') { mumu.food = Math.min(100, mumu.food + 30); mumu.mood = Math.min(100, mumu.mood + 20); mumu.love = Math.min(999, mumu.love + 10); msg = "收到豪华礼包，沐沐超开心！"; }
            showMessage(msg);
            bounce();
            updateUI(); save();
        }

        function equip(category, id) {
            if (category === 'hat' && id === 'h0') {
                mumu.eqHat = 'h0';
                showMessage("沐沐摘下了头饰。");
                updateUI(); save();
                return;
            }
            const owned = mumu.unlocked.includes(id);
            if (!owned) {
                const price = category === 'clothes' ? PRICES.clothes[id] : PRICES.hat[id];
                if (mumu.coins < price) { showMessage("金币不够，买不起哦~"); return; }
                mumu.coins -= price;
                mumu.unlocked.push(id);
                showMessage("购买成功！");
            }
            if (category === 'clothes') mumu.eqClothes = id;
            if (category === 'hat') mumu.eqHat = id;
            updateUI(); save();
        }

        function resetGame() {
            if (!confirm("确定要重置游戏吗？所有进度都会丢失。")) return;
            mumu = JSON.parse(JSON.stringify(defaultSave));
            updateUI();
            localStorage.setItem('mumu_dress_save', JSON.stringify(mumu));
            showMessage("游戏已重置，重新开始吧~");
        }

        updateUI();
        showMessage("欢迎来到虚拟沐沐的世界！点击下方按钮和她互动吧~");

        setInterval(() => {
            if (mumu.isSleeping) {
                mumu.energy = Math.min(100, mumu.energy + 5);
            } else {
                mumu.food = Math.max(0, mumu.food - 1);
                mumu.mood = Math.max(0, mumu.mood - 1);
                if (mumu.food < 20) mumu.mood = Math.max(0, mumu.mood - 1);
            }
            updateUI(); save();
        }, 10000);
    </script>
</body>
</html>
